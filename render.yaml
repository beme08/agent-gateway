# Render Blueprint for the FastAPI backend (agent-gateway-api)
# Deploy: New -> Blueprint -> connect repo, or New -> Web Service with these values.
services:
  - type: web
    name: agent-gateway-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        value: https://dabksbszhwqnpglattvb.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AGENT_API_KEY
        generateValue: true
      - key: ENABLE_PUBLIC_UPLOAD
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: COHERE_API_KEY
        sync: false
      # --- Provider chain ---------------------------------------------------
      # Public demo default: a FAST frontier model through the generic
      # OpenAI-compatible client (measured ~0.4s vs ox-alpha ~15s locally /
      # ~82s from Render free-tier). Same gateway, same guardrails, same
      # eval suite — only the serving model differs.
      #
      #   LLM_API_KEY falls back to OPENROUTER_API_KEY when unset, so this
      #   arms automatically with the key already in the dashboard.
      #
      # Flip back to ox-alpha for an interview/frontier trace:
      #   LLM_PROVIDER=oxalpha
      - key: LLM_PROVIDER
        value: openai_compat
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: google/gemini-2.5-flash
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OXALPHA_MODEL
        value: stealth/ox-alpha
      # COHERE_API_KEY (if set) becomes the third link: openai_compat ->
      # oxalpha -> cohere -> offline mock.
