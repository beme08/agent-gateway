# Render Blueprint for the FastAPI backend (agent-gateway-api)
# Deploy: New -> Blueprint -> connect repo, or New -> Web Service with these values.
services:
  - type: web
    name: agent-gateway-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        value: https://dabksbszhwqnpglattvb.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AGENT_API_KEY
        generateValue: true
      - key: ENABLE_PUBLIC_UPLOAD
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: COHERE_API_KEY
        sync: false
      # Original generic OpenAI-compatible fallback (FreeLLMAPI etc).
      # Set these in the dashboard to arm the middle link of the failover
      # chain: oxalpha -> openai_compat -> cohere -> offline mock.
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: auto
      # Support Operations LLM routing (ox-alpha via OpenRouter).
      # Only the secret must be set in the dashboard; the rest is blueprint-
      # managed so the provider chain is configured for every deploy.
      - key: LLM_PROVIDER
        value: oxalpha
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OXALPHA_MODEL
        value: stealth/ox-alpha
      - key: OPENROUTER_API_KEY
        sync: false
