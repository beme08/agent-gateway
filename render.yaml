# Render Blueprint for the FastAPI backend (agent-gateway-api)
# Deploy: New -> Blueprint -> connect repo, or New -> Web Service with these values.
services:
  - type: web
    name: agent-gateway-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        value: https://dabksbszhwqnpglattvb.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: AGENT_API_KEY
        generateValue: true
      - key: ENABLE_PUBLIC_UPLOAD
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: COHERE_API_KEY
        sync: false
      # --- Provider chain ---------------------------------------------------
      # Default provider is ox-alpha (the only model currently serving free
      # on this OpenRouter key — the shared free-tier bucket for gemini-2.5
      # flash and other fast models is exhausted, returning 403). The generic
      # OpenAI-compatible client plus this blueprint make a FAST path a
      # one-line change when quota headroom exists:
      #
      #   LLM_PROVIDER=openai_compat
      #   LLM_BASE_URL=https://openrouter.ai/api/v1
      #   LLM_MODEL=google/gemini-2.5-flash   (~0.4s vs ox-alpha ~15-26s)
      #
      #   LLM_API_KEY falls back to OPENROUTER_API_KEY when unset, so only
      #   LLM_PROVIDER + LLM_MODEL need editing.
      - key: LLM_PROVIDER
        value: oxalpha
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: stealth/ox-alpha
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OXALPHA_MODEL
        value: stealth/ox-alpha
      # COHERE_API_KEY (if set) becomes the third link: openai_compat ->
      # oxalpha -> cohere -> offline mock.
